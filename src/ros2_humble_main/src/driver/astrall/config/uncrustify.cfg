# Google C++ 格式：与 ament_cpplint 的 80 列检查保持一致。
newlines = lf
utf8_bom = remove
input_tab_size = 8
output_tab_size = 2
indent_columns = 2
indent_continue = 4
indent_with_tabs = 0
indent_class = true
indent_namespace = false
indent_access_spec = -1
indent_switch_case = 2
indent_ctor_init_leading = 2
indent_ctor_init = 4

code_width = 80
ls_for_split_full = true
ls_func_split_full = true
nl_end_of_file = force
nl_end_of_file_min = 1
nl_max = 2

sp_arith = force
sp_assign = force
sp_bool = force
sp_compare = force
sp_after_comma = force
sp_before_comma = remove
sp_before_semi = remove
sp_after_semi_for = force
sp_before_sparen = force
sp_inside_sparen = remove
sp_inside_paren = remove
sp_inside_fparen = remove
sp_inside_square = remove
sp_inside_braces = force
sp_inside_braces_empty = remove
sp_func_call_paren = remove
sp_func_def_paren = remove
sp_func_proto_paren = remove
sp_paren_brace = force
sp_sparen_brace = force
sp_fparen_brace = force
sp_before_ptr_star = remove
sp_after_ptr_star = force
sp_before_ptr_star_func = remove
sp_after_ptr_star_func = force
sp_before_byref = remove
sp_after_byref = force
sp_before_byref_func = remove
sp_after_byref_func = force
sp_before_angle = remove
sp_template_angle = force
sp_inside_angle = remove
sp_angle_shift = remove
sp_permit_cpp11_shift = true
sp_after_angle = force
sp_angle_paren = remove
sp_angle_paren_empty = remove
sp_before_class_colon = force
sp_after_class_colon = force
sp_before_constr_colon = force
sp_after_constr_colon = force
sp_cpp_lambda_square_paren = remove
sp_cpp_lambda_square_brace = force
sp_cpp_lambda_paren_brace = force

nl_fdef_brace = remove
nl_class_brace = remove
nl_struct_brace = remove
nl_enum_brace = remove
nl_namespace_brace = remove
nl_if_brace = remove
nl_elseif_brace = remove
nl_else_brace = remove
nl_brace_else = remove
nl_for_brace = remove
nl_while_brace = remove
nl_do_brace = remove
nl_brace_while = remove
nl_switch_brace = remove
nl_try_brace = remove
nl_catch_brace = remove
nl_brace_catch = remove

cmt_indent_multi = false
cmt_cpp_to_c = false
mod_full_brace_if = force
mod_full_brace_for = force
mod_full_brace_while = force
mod_full_brace_do = force
