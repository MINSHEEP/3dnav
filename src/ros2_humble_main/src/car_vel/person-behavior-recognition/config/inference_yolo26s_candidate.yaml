protocol_version: 1
profile: yolo_pose_rules_paddle_aux_v1
vendor_dir: vendor/PaddleDetection
device: CPU
run_mode: paddle
enable_mkldnn: true
cpu_threads: 4
gpu_lock: run/gpu.lock
disabled_ir_passes:
- conv_elementwise_add_act_fuse_pass
- conv_elementwise_add2_act_fuse_pass
- conv_elementwise_add_fuse_pass
models:
  yolo_pose: output_inference/yolo26s_pose_openvino_fp32/model.xml
  smoking: output_inference/ppyoloe_smoking_openvino_fp32
  fight: output_inference/ppTSM_int8_224_cpu_candidate/model.xml
yolo_pose:
  backend: openvino
  confidence: 0.25
  nms_iou: 0.45
  max_det: 300
  max_nms_candidates: 30000
  cpu_threads: 4
  output_format: yolo26_end2end
tracking:
  max_gap_seconds: 0.3
  retention_seconds: 0.7
  ambiguity_margin: 0.08
  min_iou: 0.15
  max_center_distance: 0.45
  reassociation_max_gap_seconds: 0.6
  reassociation_min_iou: 0.5
  reassociation_max_center_distance: 0.25
  reassociation_max_pose_distance: 0.3
  reassociation_max_shape_distance: 0.25
  reassociation_min_body_keypoints: 4
  reassociation_min_prior_observations: 3
fall:
  mode: geometry_posture_and_observed_transition
  score_kind: rule_evidence
  keypoint_confidence: 0.3
  min_visible_keypoints: 8
  min_torso_tilt: 30.0
  aspect_ratio_threshold: 0.9
  lying_confirm_seconds: 0.4
  recovery_confirm_seconds: 0.8
  max_observation_gap_seconds: 0.3
  max_visibility_gap_seconds: 0.4
  candidate_retention_seconds: 0.8
  reassociation_max_gap_seconds: 0.6
  minimum_lying_observations: 3
  history_seconds: 2.0
  minimum_baseline_seconds: 0.2
  minimum_drop_torso_lengths: 0.35
  minimum_rotation_degrees: 20.0
  minimum_height_loss_ratio: 0.2
  temporal_validation: pending_fixed_video_comparison
smoking:
  positive_class: 0
  threshold: 0.5
  threshold_validation: mouth_association_tuned_on_21_clip_development_set_not_independent_accuracy
  association:
    enabled: true
    keypoint_confidence: 0.5
    max_evidence_candidates: 8
  sample_hz: 2.0
  scheduling: global_clock_fair_oldest_first
  batch_size: 8
  max_rois_per_tick: 8
  diagnostic_max_detections: 20
  result_ttl_seconds: 1.5
  profile_refinement:
    enabled: true
    threshold: 0.5
    continue_threshold: 0.3
    crop_radius_heads: 2.0
    minimum_profile_ratio: 0.35
    maximum_head_pixels: 64.0
    max_rois_per_tick: 2
  hand_to_mouth:
    enabled: true
    evidence_ttl_seconds: 3.0
    confirmation_seconds: 0.2
    minimum_far_distance_heads: 2.0
    maximum_near_distance_heads: 1.5
    minimum_approach_heads: 1.0
    max_wrist_distance_heads: 1.5
    wrist_ambiguity_margin_heads: 0.25
    near_face:
      enabled: true
      start_threshold: 0.65
      continue_threshold: 0.3
      mouth_half_width_heads: 1.25
      mouth_half_height_heads: 0.5
      maximum_wrist_mouth_distance_heads: 2.0
      max_candidate_shift_heads: 0.75
      occlusion_grace_seconds: 1.0
  temporal:
    enabled: false
    minimum_positive_observations: 2
    confirmation_window_seconds: 1.0
    minimum_confirmation_seconds: 0.25
    max_prediction_gap_seconds: 0.75
    track_gap_seconds: 0.3
  backend: openvino
  cpu_threads: 4
  skip_unobservable: true
fight:
  backend: openvino
  async_inference: true
  async_timeout_seconds: 5.0
  cpu_threads: 2
  positive_class: 1
  minimum_score: 0.5
  positive_minimum_score: 0.8
  threshold_validation: tuned_on_21_clip_development_set_not_independent_accuracy
  window_frames: 8
  sample_hz: 4.285714285714286
  nominal_window_seconds: 1.6333333333333333
  max_sample_gap_seconds: 0.6
  max_window_seconds: 3.0
  prediction_interval_seconds: 0.4666666666666667
  result_ttl_seconds: 1.0
  short_size: 238
  target_size: 224
stream:
  reset_gap_seconds: 1.0
  max_header_bytes: 65536
  max_payload_bytes: 25165824
  max_dimension: 4096
opencv_threads: 1
