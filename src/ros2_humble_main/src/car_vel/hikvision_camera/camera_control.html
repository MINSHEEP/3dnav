<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>USB 相机本地状态</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#0b1221;color:#e8f1ff}
    *{box-sizing:border-box}body{margin:0}.shell{max-width:1400px;margin:auto;padding:18px}.top,.card{border:1px solid #2e3d59;border-radius:14px;background:#141d31}.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}.top h1{margin:0;font-size:22px}.status{color:#75e6a7}.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,.8fr);gap:16px;margin-top:16px}.card{padding:16px}.frame{position:relative;display:grid;place-items:center;min-height:520px;overflow:hidden;border:1px solid #354665;border-radius:12px;background:#050913}.frame img{display:block;width:100%;height:100%;object-fit:contain}.badge{position:absolute;top:12px;left:12px;padding:6px 10px;border:1px solid #47597a;border-radius:7px;background:#0a1120dd}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}button{min-height:44px;border:1px solid #526789;border-radius:8px;background:#30476f;color:#fff;font-weight:700;cursor:pointer}button.primary{background:#216ba4;border-color:#52b6ff}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metrics div{padding:12px;border-radius:9px;background:#0f1729}.metrics span{display:block;color:#91a5c7;font-size:12px}.metrics strong{display:block;margin-top:7px;word-break:break-word}.log{min-height:150px;margin-top:12px;padding:12px;white-space:pre-wrap;border-radius:9px;background:#080e1b;color:#b9d6ff;font:12px/1.5 Consolas,monospace}@media(max-width:900px){.grid{grid-template-columns:1fr}.frame{min-height:340px}.actions{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><h1>USB 固定摄像头</h1><div id="connection" class="status">正在连接…</div></header>
  <div class="grid">
    <section class="card">
      <div class="frame"><span id="badge" class="badge">原始画面</span><img id="feed" alt="USB 相机实时画面"></div>
      <div class="actions">
        <button id="yolo" class="primary">启动 YOLO</button>
        <button id="view">查看 YOLO 画面</button>
        <button id="reconnect">重连视频</button>
        <button id="snapshot">打开当前帧</button>
      </div>
    </section>
    <aside class="card">
      <div class="metrics">
        <div><span>设备</span><strong id="device">/dev/video0</strong></div>
        <div><span>后端</span><strong id="backend">--</strong></div>
        <div><span>格式</span><strong id="format">--</strong></div>
        <div><span>YOLO</span><strong id="yolo-state">已停止</strong></div>
      </div>
      <pre id="log" class="log">[系统] 等待设备状态同步。</pre>
    </aside>
  </div>
</main>
<script>
(() => {
  const $=id=>document.getElementById(id);let state={yolo:{}},mode='raw',timer=null,busy=false;
  const post=(path,data)=>fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(async r=>{const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||`HTTP ${r.status}`);return p});
  const note=text=>{$('log').textContent=`[${new Date().toLocaleTimeString()}] ${text}\n${$('log').textContent}`.split('\n').slice(0,10).join('\n')};
  function connect(delay=0){clearTimeout(timer);if(document.hidden)return;timer=setTimeout(()=>{if(!document.hidden)$('feed').src=`/api/preview/stream?source=${mode==='yolo'?'yolo':'raw'}&profile=remote&t=${Date.now()}`},delay)}
  document.addEventListener('visibilitychange',()=>{clearTimeout(timer);$('feed').removeAttribute('src');if(!document.hidden)connect()});
  window.addEventListener('pagehide',()=>{clearTimeout(timer);clearInterval(statusTimer);$('feed').removeAttribute('src')});
  function updateView(){const marked=mode==='yolo';$('badge').textContent=marked?'YOLO 标注画面':'原始画面';$('view').textContent=marked?'查看原始画面':'查看 YOLO 画面'}
  async function refresh(){try{state=await fetch('/api/status',{cache:'no-store'}).then(r=>r.json());const v=state.video||{},y=state.yolo||{};$('connection').textContent=state.connected&&!v.error?'● 相机在线':'○ 相机异常';$('device').textContent=v.device||'/dev/video0';$('backend').textContent=v.backend||'--';$('format').textContent=v.width?`${v.width}×${v.height} / ${Number(v.fps||0).toFixed(1)} FPS / ${v.fourcc||'--'}`:'--';$('yolo-state').textContent=y.running?(y.ready?'运行中':'启动中'):(y.error?'异常':'已停止');$('yolo').textContent=y.running?'停止 YOLO':'启动 YOLO';if(!y.running&&mode==='yolo'){mode='raw';updateView();connect(50)}}catch(error){$('connection').textContent='○ 相机服务失联'}}
  $('feed').addEventListener('error',()=>connect(1600));
  $('yolo').addEventListener('click',async()=>{if(busy)return;busy=true;$('yolo').disabled=true;try{const y=await post('/api/yolo',{operation:'toggle'});state.yolo=y;mode=y.running?'yolo':'raw';updateView();connect(100);note(y.running?'YOLO 已启动':'YOLO 已停止');await refresh()}catch(error){note(`YOLO：${error.message}`)}finally{busy=false;$('yolo').disabled=false}});
  $('view').addEventListener('click',()=>{if(mode==='raw'&&!state.yolo?.running){note('请先启动 YOLO');return}mode=mode==='raw'?'yolo':'raw';updateView();connect()});
  $('reconnect').addEventListener('click',async()=>{try{if(mode==='raw')await post('/api/video',{operation:'restart'});connect(80);note('视频已重连')}catch(error){note(`重连失败：${error.message}`)}});
  $('snapshot').addEventListener('click',()=>window.open(`${mode==='yolo'?'/api/yolo/frame.jpg':'/api/snapshot'}?t=${Date.now()}`,'_blank','noopener'));
  updateView();connect();refresh();const statusTimer=setInterval(()=>{if(!document.hidden)refresh()},2000);
})();
</script>
</body>
</html>
