<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>修图 · 四足机器人导航</title>
    <link rel="stylesheet" href="robot_ui.css">
    <script src="rosbridge_client.js?v=20260727-fragments"></script>
    <script src="robot_ui_common.js?v=20260727-dog-status"></script>
</head>
<body>
<div class="app-shell">
    <header class="topbar">
        <div class="brand">四足机器人导航</div>
        <nav class="page-nav" aria-label="功能页面">
            <a href="mapping.html">建图</a>
            <a class="active" href="map_editor.html" aria-current="page">修图</a>
            <a href="navigation.html">导航</a>
            <a href="remote_control.html">遥控</a>
        </nav>
        <div class="topbar-statuses">
            <div id="battery-status" class="battery-status stale">电量 --（状态失联）</div>
            <div id="connection-status" class="page-status">○ 正在连接 ROS2…</div>
        </div>
    </header>

    <main class="workspace">
        <section id="map-wrapper" class="map-wrapper" aria-label="地图编辑画布">
            <canvas id="map-canvas"></canvas>
            <div id="map-overlay" class="map-overlay blocked">请先在右侧选择并打开一张已保存的 PGM + YAML 地图。</div>
            <div class="zoom-controls" aria-label="地图缩放">
                <button id="btn-zoom-in" type="button" title="放大">＋</button>
                <button id="btn-zoom-out" type="button" title="缩小">－</button>
                <button id="btn-reset-view" type="button" title="复位视图">⌂</button>
            </div>
        </section>

        <aside class="panel">
            <h1>修图</h1>
            <p class="subtitle">此页面仅编辑 <code>maps/</code> 中已保存地图的 PGM 文件。进入页面会停止建图/导航核心节点，避免编辑过程影响机器人。</p>

            <section class="section">
                <div class="section-title">选择地图</div>
                <div class="row">
                    <select id="map-selector" aria-label="已保存地图"><option value="">正在读取地图列表…</option></select>
                </div>
                <div class="row">
                    <button id="btn-refresh-maps" class="flex" type="button">刷新列表</button>
                    <button id="btn-open-map" class="primary flex" type="button">打开修图</button>
                </div>
                <div class="status-grid" style="margin-top:10px">
                    <div class="status-card"><span class="label">当前地图</span><span id="editing-map-display" class="value">未打开</span></div>
                    <div class="status-card"><span class="label">编辑状态</span><span id="edit-status-display" class="value">等待</span></div>
                    <div class="status-card"><span class="label">模式</span><span id="system-status-display" class="value">停止中</span></div>
                </div>
            </section>

            <section class="section">
                <div class="section-title">绘制内容</div>
                <div class="row">
                    <button id="btn-tool-obstacle" class="tool-active flex" type="button">画障碍</button>
                    <button id="btn-tool-free" class="flex" type="button">可通行</button>
                    <button id="btn-tool-unknown" class="flex" type="button">未知</button>
                </div>
                <div class="section-title" style="margin-top:14px">绘制方式</div>
                <div class="row">
                    <button id="btn-shape-brush" class="choice-active flex" type="button">画笔拖拽</button>
                    <button id="btn-shape-rectangle" class="flex" type="button">矩形框选</button>
                </div>
                <div class="row" style="margin-top:10px">
                    <span style="font-size:13px;color:var(--muted);white-space:nowrap">画笔半径</span>
                    <input id="brush-radius" type="range" min="0" max="10" step="1" value="2">
                    <strong id="brush-radius-value" style="min-width:34px;text-align:right">2</strong>
                </div>
                <p class="hint">选择内容和工具后，在地图上左键操作。每次完成一次画笔拖拽或一个矩形框选，都会成为可单步撤销的一次修改。</p>
            </section>

            <section class="section">
                <div class="section-title">提交修改</div>
                <div class="row">
                    <button id="btn-undo" class="warning flex" type="button" disabled>撤销上一步</button>
                    <button id="btn-save-edits" class="success flex" type="button" disabled>覆盖保存</button>
                </div>
                <p class="hint">覆盖保存会直接更新所选地图的 PGM；YAML 中的分辨率和原点参数保持不变。</p>
            </section>

            <section class="section">
                <div class="section-title">运行日志</div>
                <div id="log-area" class="log-area" aria-live="polite"></div>
            </section>
        </aside>
    </main>
</div>

<script>
(() => {
    'use strict';
    const UI = window.RobotUi;
    const log = UI.createLogger(document.getElementById('log-area'));
    const connectionStatus = document.getElementById('connection-status');
    const batteryStatus = document.getElementById('battery-status');
    const overlay = document.getElementById('map-overlay');
    const mapCanvas = new UI.MapCanvas(document.getElementById('map-canvas'), document.getElementById('map-wrapper'));
    UI.bindZoomButtons(mapCanvas);

    const tools = {
        obstacle: { label: '障碍', pgmValue: 0, occupancyValue: 100 },
        free: { label: '可通行', pgmValue: 254, occupancyValue: 0 },
        unknown: { label: '未知', pgmValue: 205, occupancyValue: -1 }
    };
    let session;
    let editingMapName = '';
    let editDirty = false;
    let activeTool = 'obstacle';
    let activeShape = 'brush';
    let serviceBusy = false;

    function selectedMap() { return document.getElementById('map-selector').value; }
    function activeToolInfo() { return tools[activeTool]; }

    function updateEditorUi() {
        document.getElementById('editing-map-display').textContent = editingMapName || '未打开';
        document.getElementById('edit-status-display').textContent = editingMapName ? (editDirty ? '未保存' : '已保存') : '等待';
        document.getElementById('btn-open-map').disabled = serviceBusy;
        document.getElementById('btn-refresh-maps').disabled = serviceBusy;
        document.getElementById('map-selector').disabled = serviceBusy;
        document.getElementById('btn-undo').disabled = !editingMapName || serviceBusy;
        document.getElementById('btn-save-edits').disabled = !editingMapName || serviceBusy;
        document.getElementById('btn-tool-obstacle').classList.toggle('tool-active', activeTool === 'obstacle');
        document.getElementById('btn-tool-free').classList.toggle('tool-active', activeTool === 'free');
        document.getElementById('btn-tool-unknown').classList.toggle('tool-active', activeTool === 'unknown');
        document.getElementById('btn-shape-brush').classList.toggle('choice-active', activeShape === 'brush');
        document.getElementById('btn-shape-rectangle').classList.toggle('choice-active', activeShape === 'rectangle');
        overlay.textContent = editingMapName
            ? `当前工具：${activeToolInfo().label} / ${activeShape === 'brush' ? '画笔拖拽' : '矩形框选'}。左键编辑，右键拖拽平移，滚轮缩放。`
            : '请先在右侧选择并打开一张已保存的 PGM + YAML 地图。';
        overlay.classList.toggle('blocked', !editingMapName);
    }

    function configureCanvasEditor() {
        if (!editingMapName || serviceBusy) {
            mapCanvas.setEditorInteraction(null);
            updateEditorUi();
            return;
        }
        mapCanvas.setEditorInteraction({
            shape: activeShape,
            brushRadius: Number(document.getElementById('brush-radius').value),
            onPreview: (cells) => mapCanvas.applyOccupancyCells(cells, activeToolInfo().occupancyValue),
            onCommit: commitEditOperation
        });
        updateEditorUi();
    }

    function mapInfoFromResponse(result) {
        const origin = result.origin || [0, 0, 0];
        return {
            width: result.width,
            height: result.height,
            resolution: result.resolution,
            origin: {
                position: { x: Number(origin[0]) || 0, y: Number(origin[1]) || 0, z: Number(origin[2]) || 0 },
                orientation: { x: 0, y: 0, z: 0, w: 1 }
            }
        };
    }

    async function stopRobotModes() {
        if (!session || !session.connected) return;
        document.getElementById('system-status-display').textContent = '停止中';
        try {
            const result = await session.call('/control_launch', UI.TYPES.controlLaunch, {
                action: 'stop', package_name: 'car_vel', launch_type: 'all'
            });
            if (!result.success) throw new Error(result.message || '停止请求未成功');
            document.getElementById('system-status-display').textContent = '已停止';
            log(`建图/导航核心节点已停止：${result.message || '成功'}`);
        } catch (error) {
            document.getElementById('system-status-display').textContent = '停止失败';
            log(`停止建图/导航节点失败：${error.message || error}`);
        }
    }

    async function refreshMaps(preferred) {
        if (!session || !session.connected) return;
        try {
            const result = await session.call('/get_map_list', UI.TYPES.mapList, {});
            if (!result.success) throw new Error(result.message || '读取地图列表失败');
            const select = document.getElementById('map-selector');
            const wanted = preferred || select.value || editingMapName;
            select.innerHTML = '<option value="">请选择已保存地图</option>';
            (result.map_names || []).forEach((name) => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });
            if (wanted && [...select.options].some((option) => option.value === wanted)) select.value = wanted;
            log(`已读取 ${result.map_names ? result.map_names.length : 0} 张已保存地图。`);
        } catch (error) {
            log(`读取地图列表失败：${error.message || error}`);
        }
    }

    async function openSelectedMap() {
        if (serviceBusy) {
            log('地图正在读取或保存，请等待当前操作完成。');
            return;
        }
        const mapName = selectedMap();
        if (!mapName) { log('请先选择一张已保存地图。'); return; }
        if (editDirty && mapName !== editingMapName && !window.confirm('当前修图尚未保存，确定放弃这些修改并打开另一张地图吗？')) return;
        serviceBusy = true;
        configureCanvasEditor();
        try {
            const result = await session.call('/get_edited_map', UI.TYPES.editedMap, { map_name: mapName });
            if (!result.success) throw new Error(result.message || '读取修图地图失败');
            editingMapName = mapName;
            editDirty = Boolean(result.has_changes);
            mapCanvas.setMap(mapInfoFromResponse(result), result.image_data, { reset: true });
            log(`已打开地图“${mapName}”${result.has_changes ? '（恢复了未保存编辑）' : ''}。`);
        } catch (error) {
            log(`打开地图失败：${error.message || error}`);
        } finally {
            serviceBusy = false;
            configureCanvasEditor();
        }
    }

    async function commitEditOperation(cells) {
        if (!editingMapName || !cells.length || serviceBusy) return;
        const tool = activeToolInfo();
        serviceBusy = true;
        // Disable new canvas gestures until this single complete stroke/rectangle
        // is recorded by the backend as exactly one undo entry.
        mapCanvas.setEditorInteraction(null);
        updateEditorUi();
        try {
            const result = await session.call('/set_map_pixel_indices', UI.TYPES.setMapPixels, {
                map_name: editingMapName,
                indices: cells.map((cell) => cell.serviceIndex),
                pixel_value: tool.pgmValue
            });
            if (!result.success) throw new Error(result.message || '写入地图失败');
            editDirty = true;
            log(`已应用一次${activeShape === 'brush' ? '画笔' : '矩形'}编辑（${cells.length} 个像素）：${tool.label}。`);
        } catch (error) {
            log(`本次修图失败，正在重新读取地图：${error.message || error}`);
            await openSelectedMap();
        } finally {
            serviceBusy = false;
            configureCanvasEditor();
        }
    }

    async function undoLastEdit() {
        if (!editingMapName || serviceBusy) return;
        serviceBusy = true;
        configureCanvasEditor();
        try {
            const result = await session.call('/undo_map_edits', UI.TYPES.switchMap, { map_name: editingMapName });
            if (!result.success) throw new Error(result.message || '没有可撤销的修改');
            log(`已撤销上一步：${result.message || '成功'}`);
            const refreshed = await session.call('/get_edited_map', UI.TYPES.editedMap, { map_name: editingMapName });
            if (!refreshed.success) throw new Error(refreshed.message || '刷新编辑图失败');
            editDirty = Boolean(refreshed.has_changes);
            mapCanvas.setMap(mapInfoFromResponse(refreshed), refreshed.image_data, { reset: false });
        } catch (error) {
            log(`撤销失败：${error.message || error}`);
        } finally {
            serviceBusy = false;
            configureCanvasEditor();
        }
    }

    async function saveEdits() {
        if (!editingMapName || serviceBusy) return;
        serviceBusy = true;
        configureCanvasEditor();
        try {
            const result = await session.call('/save_edited_maps', UI.TYPES.switchMap, { map_name: editingMapName });
            if (!result.success) throw new Error(result.message || '保存修图失败');
            editDirty = false;
            log(`地图“${editingMapName}”已覆盖保存：${result.message || '成功'}`);
        } catch (error) {
            log(`保存修图失败：${error.message || error}`);
        } finally {
            serviceBusy = false;
            configureCanvasEditor();
        }
    }

    session = new UI.RosSession({
        log,
        onState: (connected, text) => {
            UI.setConnectionStatus(connectionStatus, connected, text);
            if (!connected) UI.setBatteryDisconnected(batteryStatus);
        },
        onReady: async (activeSession) => {
            UI.subscribeDogStatus(activeSession, batteryStatus);
            await stopRobotModes();
            await refreshMaps(editingMapName);
        }
    });

    document.getElementById('btn-refresh-maps').addEventListener('click', () => refreshMaps());
    document.getElementById('btn-open-map').addEventListener('click', openSelectedMap);
    document.getElementById('btn-tool-obstacle').addEventListener('click', () => { activeTool = 'obstacle'; configureCanvasEditor(); });
    document.getElementById('btn-tool-free').addEventListener('click', () => { activeTool = 'free'; configureCanvasEditor(); });
    document.getElementById('btn-tool-unknown').addEventListener('click', () => { activeTool = 'unknown'; configureCanvasEditor(); });
    document.getElementById('btn-shape-brush').addEventListener('click', () => { activeShape = 'brush'; configureCanvasEditor(); });
    document.getElementById('btn-shape-rectangle').addEventListener('click', () => { activeShape = 'rectangle'; configureCanvasEditor(); });
    document.getElementById('brush-radius').addEventListener('input', (event) => {
        document.getElementById('brush-radius-value').textContent = event.target.value;
        configureCanvasEditor();
    });
    document.getElementById('btn-undo').addEventListener('click', undoLastEdit);
    document.getElementById('btn-save-edits').addEventListener('click', saveEdits);
    window.addEventListener('beforeunload', (event) => {
        if (editDirty) {
            event.preventDefault();
            event.returnValue = '';
        }
    });

    updateEditorUi();
    log('修图页面已加载，正在连接 ROS2，并停止建图/导航核心节点。');
    session.connect();
})();
</script>
</body>
</html>
