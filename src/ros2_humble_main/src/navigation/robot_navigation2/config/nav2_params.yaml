amcl:
  ros__parameters:
    use_sim_time: False
    # Small Point-LIO provides a much cleaner odometry increment than wheel
    # odometry.  The previous 0.2 values injected enough artificial motion
    # noise for AMCL to lose the map during an in-place turn.
    alpha1: 0.03
    alpha2: 0.03
    alpha3: 0.03
    alpha4: 0.03
    alpha5: 0.01
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    # 90 beams keeps strong scan-to-map constraints while reducing contention
    # with the LIO and MPPI workloads on the 4 GB controller.
    max_beams: 90
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5
    # A quadruped often finishes a goal with small body corrections.  Update
    # AMCL for those corrections so Nav2 does not keep evaluating an old pose
    # while the physical dog has already stopped near the target.
    update_min_a: 0.03
    update_min_d: 0.05
    z_hit: 0.8
    z_max: 0.0
    z_rand: 0.2
    z_short: 0.0
    scan_topic: /scan

