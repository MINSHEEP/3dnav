controller_server:
  ros__parameters:
    use_sim_time: False  # 添加这个参数
    # The recorded controller repeatedly missed 8 Hz.  A deterministic 5 Hz
    # loop is preferable for this slow platform and matches model_dt below.
    controller_frequency: 5.0
    odom_topic: "/Odometry"  # 添加这个参数
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    goal_checker_plugins: ["general_goal_checker"]  # 添加目标检查器
    progress_checker_plugin: "progress_checker"     # 添加进度检查器
    controller_plugins: ["FollowPath"]


    # 进度检查器配置
    progress_checker:
      # Humble's SimpleProgressChecker only counts x/y translation and falsely
      # aborts legitimate long turns. This local backport also counts heading.
      plugin: "robot_navigation2::PoseProgressChecker"
      required_movement_radius: 0.10
      required_movement_angle: 0.20
      movement_time_allowance: 15.0

    # 目标检查器配置
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # Avoid ineffective near-goal foot shuffling on the field robot.
      # The route manager also accepts a stable position within 30 cm.
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.349066


    FollowPath:
      # A goal behind the robot is handled deterministically: first rotate in
      # place at low speed, then let MPPI drive forward along the path.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.35
      angular_disengage_threshold: 0.17
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.30
      max_angular_accel: 0.4
      simulate_ahead_time: 1.0
      # MPPI's GoalAngleCritic below owns final heading. Keeping this disabled
      # prevents the shim from fighting replanned path headings near the goal.
      rotate_to_goal_heading: false
      closed_loop: true
      # 25 * 0.2 s preserves the former five-second prediction horizon while
      # cutting the number of evaluated trajectory states substantially.
      time_steps: 25
      model_dt: 0.2
      # Explore enough steering alternatives to route around a person or cart
      # instead of declaring every trajectory blocked from one narrow sample.
      batch_size: 800
      vx_std: 0.15
      vy_std: 0.0
      wz_std: 0.35
      vx_max: 0.25
      vx_min: 0.0
      # Stability-first differential-drive mode: lateral motion is disabled.
      vy_max: 0.0
      wz_max: 0.35
      ax_max: 1.0
      ax_min: -1.0
      ay_min: 0.0
      ay_max: 0.0
      az_max: 0.4
      iteration_count: 1
      # Retry with freshly reset noise before escalating to BT clear/recovery.
      # Three bounded retries absorb a transient scan/TF frame while a truly
      # blocked corridor still fails safely.
      retry_attempt_limit: 3
      prune_distance: 1.7
      # Recorded LIO/TF latency is normally ~40--50 ms and occasionally
      # reaches ~150 ms. Leave bounded margin so MPPI waits for the next
      # transform instead of resetting its optimizer during motion.
      transform_tolerance: 0.25
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      reset_period: 1.0 # (only in Humble)
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        # Avoid stopping early to chase heading while the dog is still
        # approaching the point. Position-only route settling handles normal
        # inspection points once this same tolerance is reached.
        threshold_to_consider: 0.25
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5
      # ObstaclesCritic:
      #   enabled: true
      #   cost_power: 1
      #   repulsion_weight: 1.5
      #   critical_weight: 20.0
      #   consider_footprint: false
      #   collision_cost: 10000.0
      #   collision_margin_distance: 0.1
      #   near_goal_distance: 0.5
      #   inflation_radius: 0.55 # (only in Humble)
      #   cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true



local_costmap:
  local_costmap:
    ros__parameters:
      # At 0.25 m/s, a 5 Hz update represents only 5 cm of travel and leaves
      # enough CPU for LIO, AMCL, and the controller.
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      # 6 m keeps the complete 2.5 m obstacle observation radius inside the
      # rolling costmap instead of clipping it at 1.5 m.
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.2
      # robot_radius: 0.3
      footprint: '[[0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25]]'
      footprint_padding: 0.05
      # plugins: ["static_layer", "obstacle_layer","inflation_layer"]
      plugins: ["obstacle_layer","inflation_layer"]

      # voxel_layer:
      #   plugin: "nav2_costmap_2d::VoxelLayer"
      #   enabled: True
      #   footprint_clearing_enabled: true
      #   max_obstacle_height: 2.0
      #   publish_voxel_map: True
      #   origin_z: 0.0
      #   z_resolution: 0.05
      #   z_voxels: 16
      #   max_obstacle_height: 2.0
      #   unknown_threshold: 15
      #   mark_threshold: 0
      #   observation_sources: pointcloud
      #   combination_method: 1
      #   pointcloud:  # no frame set, uses frame from message
      #     topic: /cloud_registered
      #     # sensor_frame: laser_2d
      #     max_obstacle_height: 2.0
      #     min_obstacle_height: 0.0
      #     obstacle_max_range: 2.5
      #     obstacle_min_range: 0.0
      #     raytrace_max_range: 10.0
      #     raytrace_min_range: 0.0
      #     clearing: True
      #     marking: True
      #     data_type: "PointCloud2"
      #     transport_type: "raw"  # raw or/ with compression (zlib, draco, zstd)




      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_2d
          max_obstacle_height: 1.5
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Keep only the latest 10 Hz observation so moving obstacles do not
          # leave a three-frame ghost in the local rolling costmap.
          observation_persistence: 0.1
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          # Seconds between expected scans (not Hz).  Mark the layer stale
          # quickly so navigation stops when perception is lost.
          expected_update_rate: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      # static_layer:
      #   plugin: "nav2_costmap_2d::StaticLayer"
      #   # map_subscribe_transient_local: True
      #   enabled: true
      #   transform_tolerance: 0.1
        # subscribe_to_updates: true

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      # robot_radius: 0.3
      footprint: '[[0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25]]'
      footprint_padding: 0.05
      resolution: 0.05
      # Keep unexplored/edited-unknown cells distinct from free space.
      track_unknown_space: True
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          sensor_frame: laser_2d
          topic: /scan
          max_obstacle_height: 1.5
          clearing: True
          marking: True
          data_type: "LaserScan"
          observation_persistence: 0.1
          expected_update_rate: 0.3
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # This is the validated 2-D map fused with slope/step/roughness costs
        # from the saved global 3-D localization cloud.
        map_topic: /terrain_costmap
        map_subscribe_transient_local: True
        subscribe_to_updates: true
        transform_tolerance: 0.25
        trinary_costmap: false
        lethal_cost_threshold: 100
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True


map_server:
  ros__parameters:
    use_sim_time: False
    # Start ACTIVE without a map. The selected map is loaded explicitly through
    # /switch_map after its 2D, PCD, terrain and metadata assets are validated.
    yaml_filename: ""
    publish_frequency: 1.0   # 添加这一行，每秒发布一次地图

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    # PGM unknown cells are written as gray 205 (occupancy 0.196078).
    # Nav2 uses a strict '< free_thresh' test, so 0.196 keeps them unknown.
    free_thresh_default: 0.196
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.10
      use_astar: false
      # Never plan through cells that the map editor marks as unknown.
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.25
    use_sim_time: False
    simulate_ahead_time: 2.0
    # Recovery spins must obey the same stability-first turn limits as the
    # path controller; the old 1.0 rad/s spin caused AMCL to lose the map.
    max_rotational_vel: 0.20
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.4

robot_state_publisher:
  ros__parameters:
    use_sim_time: False


waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 0.25]
    min_velocity: [-0.10, 0.0, -0.25]
    max_accel: [0.5, 0.0, 0.4]
    max_decel: [-0.5, 0.0, -0.4]
    odom_topic: "Odometry"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.3
