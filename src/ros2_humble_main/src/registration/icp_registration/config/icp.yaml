/icp_registration:
  ros__parameters:
    use_sim_time: false

    # The action loads <map_name>.pcd and <map_name>.localization.yaml only
    # when /relocalize is called. Legacy PCDs without validated metadata are
    # deliberately rejected.
    pcd_directory: "/home/a/nav_ws/src/ros2_humble_main/src/navigation/robot_navigation2/pcdmaps"
    metadata_schema: "ros2_mid360_localization_map"
    metadata_version: 1

    pointcloud_topic: "/cloud_registered"
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_footprint"

    # Goal fields use metres/radians. Zero values select these defaults. The
    # hard limits implement the agreed automatic-acceptance envelope.
    default_search_xy: 1.0
    default_search_yaw_deg: 30.0
    hard_max_search_xy: 1.0
    hard_max_search_yaw_deg: 30.0
    default_timeout_sec: 10.0
    maximum_timeout_sec: 10.0

    # Three distinct timestamp frames provide a cheap consistency gate without
    # running a continuous registration loop.
    accumulation_frames: 3
    minimum_consistent_frames: 3
    cloud_wait_timeout_sec: 3.0
    tf_lookup_retry_sec: 0.25

    # Live-cloud filtering in base_footprint coordinates. The points themselves
    # remain in odom, matching /cloud_registered's actual frame contract.
    source_min_range: 0.55
    # Match the live-cloud radius to the 8 m target ROI. The extra 1 m ROI
    # search margin covers the maximum accepted rough-pose correction.
    source_max_range: 8.0
    source_min_z: -0.15
    source_max_z: 2.5
    source_self_radius: 0.55
    source_self_min_z: -0.5
    source_self_max_z: 0.7

    # Conservative 4 GB RAM / low-CPU limits.
    rough_leaf_size: 0.45
    fine_leaf_size: 0.22
    minimum_points_per_frame: 250
    # NDT uses the coarser voxel cloud and therefore needs its own lower count
    # gate. GICP and final quality checks still use the denser 700-point cloud.
    minimum_rough_source_points: 300
    minimum_source_points: 700
    minimum_target_points: 1200
    maximum_raw_points_per_frame: 80000
    maximum_rough_source_points: 4000
    maximum_fine_source_points: 8000
    maximum_rough_target_points: 18000
    maximum_fine_target_points: 30000
    maximum_map_points: 1000000
    maximum_pcd_mebibytes: 64
    roi_radius: 8.0
    roi_min_z: -1.5
    roi_max_z: 3.0

    # Coarse NDT. The browser already supplies a dragged heading within the
    # agreed ±30° envelope. One hypothesis keeps this stage inside the
    # LubanCat 4 time budget; NDT still optimizes the full transform.
    ndt_resolution: 1.0
    ndt_step_size: 0.2
    ndt_transformation_epsilon: 0.01
    ndt_maximum_iterations: 6
    ndt_yaw_hypotheses: 1
    ndt_maximum_fitness: 2.0

    # Fine GICP.
    gicp_maximum_iterations: 6
    gicp_maximum_optimizer_iterations: 4
    gicp_maximum_correspondence_distance: 0.6
    gicp_transformation_epsilon: 0.001
    gicp_fitness_epsilon: 0.0001
    gicp_correspondence_randomness: 12

    # Final acceptance gates. `fitness` returned by the Action is the
    # matched-point RMSE in metres, not PCL's squared fitness score.
    metric_maximum_distance: 0.4
    maximum_rmse: 0.20
    minimum_overlap: 0.55
    minimum_planar_eigen_ratio: 0.01
    minimum_matched_points: 350
    maximum_vertical_correction: 0.35
    maximum_tilt_deg: 8.0
    minimum_refined_xy_stddev: 0.05
    refined_yaw_stddev_deg: 5.0
